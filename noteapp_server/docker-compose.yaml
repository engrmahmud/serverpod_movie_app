services:
  # Development services
  postgres:
    image: pgvector/pgvector:pg16
    ports:
      - "8090:5432"
    environment:
      POSTGRES_USER: postgres
      POSTGRES_DB: noteapp
      POSTGRES_PASSWORD: "zvXC9lLlWIH8rxlljU9QIsHTfdHS3YFV"
    volumes:
      - noteapp_data:/var/lib/postgresql/data

  redis:
    image: redis:6.2.6
    ports:
      - "8091:6379"
    command: redis-server --requirepass "jAVQ3kz-3twlDNjezbW8RbYN9mfzHa0k"
    environment:
      - REDIS_REPLICATION_MODE=master

  # Test services
  postgres_test:
    image: pgvector/pgvector:pg16
    ports:
      - "9090:5432"
    environment:
      POSTGRES_USER: postgres
      POSTGRES_DB: noteapp_test
      POSTGRES_PASSWORD: "SKBztJm7Z1B4DAgdQDM6Qf352Oj-ICxp"
    volumes:
      - noteapp_test_data:/var/lib/postgresql/data

  redis_test:
    image: redis:6.2.6
    ports:
      - "9091:6379"
    command: redis-server --requirepass "maD8oiWND69u0KM0EvWDUCm5Vx1tJG4q"
    environment:
      - REDIS_REPLICATION_MODE=master

volumes:
  noteapp_data:
  noteapp_test_data:
